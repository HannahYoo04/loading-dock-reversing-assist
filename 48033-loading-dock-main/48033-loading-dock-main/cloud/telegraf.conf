# 48033 Final Project - Loading Dock Reversing Assist, cloud side
#
# Data flow: MQTT broker -> Telegraf -> InfluxDB Cloud (W10 s26-30)
# Telegraf subscribes to every bay's topics, turns each JSON message into an
# InfluxDB point and writes it into the "dock" bucket.
#
# In PowerShell, run these commands from this folder:
#   $env:INFLUX_TOKEN = "<API token from InfluxDB Cloud>"
#   $env:INFLUX_ORG   = "<organisation name or ID>"
#   telegraf --config telegraf.conf

[agent]
  flush_interval = "5s"     # send data to InfluxDB every 5 s
  omit_hostname  = true     # do not tag every point with the laptop's name so it is not added to every data point

# ---------- output: InfluxDB Cloud ----------
[[outputs.influxdb_v2]]
  urls         = ["https://us-east-1-1.aws.cloud2.influxdata.com"]   # same InfluxDB Cloud URL as Lab 10
  token        = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket       = "dock"

# ---------- input 1: telemetry and events ----------
# Both carry "ts" (ms since 1970, UTC), so InfluxDB stores when the ESP32 measured it,
# not when Telegraf received it.
[[inputs.mqtt_consumer]]
  servers   = ["tcp://broker.emqx.io:1883"]
  topics    = ["jon48033/dock/+/telemetry", "jon48033/dock/+/event"]   # + wildcard matches one bay name
  username  = "emqx"
  password  = "public"
  qos       = 0
  topic_tag = ""            # no raw topic tag, topic_parsing below gives a cleaner "bay" tag

  data_format      = "json"
  tag_keys         = ["state", "event"]   # text values: store state and event names as tags so they can be used to filter the data
  json_time_key    = "ts"
  json_time_format = "unix_ms"

  # Example: this topic becomes measurement "telemetry" with the tag bay=bay1
  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "jon48033/dock/+/+"
    measurement = "_/_/_/measurement"
    tags        = "_/_/bay/_"

# ---------- input 2: online / offline status ----------
# The client sends online=1 when it connects
# If it disconnects unexpectedly, the broker sends online=0 as the Last Will
[[inputs.mqtt_consumer]]
  servers   = ["tcp://broker.emqx.io:1883"]
  topics    = ["jon48033/dock/+/status"]
  username  = "emqx"
  password  = "public"
  qos       = 0
  topic_tag = ""

  data_format = "json"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "jon48033/dock/+/+"
    measurement = "_/_/_/measurement"
    tags        = "_/_/bay/_"
